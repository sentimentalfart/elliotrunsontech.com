<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2" />
      <stop offset="50%" stop-color="#4752c4" />
      <stop offset="100%" stop-color="#2d31a6" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57f287" />
      <stop offset="100%" stop-color="#00b0f4" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Stylized Gamepad / Message Chat Combined Emblem -->
  <path d="M140 180 C 140 140, 180 120, 256 120 C 332 120, 372 140, 372 180 C 372 260, 340 320, 256 320 C 220 320, 190 335, 150 360 C 158 330, 150 300, 140 280 C 140 240, 140 200, 140 180 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Main Game Controller Body -->
  <g filter="url(#dropShadow)">
    <path d="M150 200 C 120 200, 95 240, 110 320 C 120 370, 160 380, 190 350 L 225 315 C 235 305, 277 305, 287 315 L 322 350 C 352 380, 392 370, 402 320 C 417 240, 392 200, 362 200 C 310 200, 290 230, 256 230 C 222 230, 202 200, 150 200 Z" fill="#ffffff" />
  </g>

  <!-- D-Pad (Left Controller) -->
  <g fill="#5865f2">
    <rect x="160" y="248" width="16" height="44" rx="4" />
    <rect x="146" y="262" width="44" height="16" rx="4" />
  </g>

  <!-- Action Buttons (Right Controller) -->
  <g>
    <circle cx="340" cy="254" r="8" fill="#57f287" />
    <circle cx="340" cy="286" r="8" fill="#fee75c" />
    <circle cx="324" cy="270" r="8" fill="#eb459e" />
    <circle cx="356" cy="270" r="8" fill="#ed4245" />
  </g>

  <!-- Center Glowing Shenanigans Sparkle -->
  <g filter="url(#glow)">
    <path d="M256 160 L 264 185 L 289 193 L 264 201 L 256 226 L 248 201 L 223 193 L 248 185 Z" fill="url(#neonGlow)" />
  </g>
</svg>
